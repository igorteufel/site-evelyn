<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#344E3A" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
  <title>Página não encontrada | Evelyn Peneluppi</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Lato", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #2E2925;
      background: #FBF8F2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(560px, 100%);
      padding: 48px 32px;
      border: 1px solid #E4DACE;
      border-radius: 18px;
      background: #FFFDF9;
      text-align: center;
      box-shadow: 0 14px 36px rgba(74, 51, 36, 0.06);
    }

    img {
      width: 72px;
      height: 72px;
    }

    .eyebrow {
      margin: 24px 0 12px;
      color: #A9431F;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #182B20;
      font-size: clamp(36px, 7vw, 56px);
      line-height: 1.02;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .message {
      margin: 20px auto 0;
      color: #695F57;
      font-size: 17px;
      line-height: 1.7;
    }

    a {
      min-height: 48px;
      margin-top: 32px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: #FFFDF9;
      background: #A9431F;
      font-weight: 900;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid #A9431F;
      outline-offset: 3px;
      box-shadow: 0 0 0 3px rgba(169, 67, 31, 0.24);
    }

    @media (max-width: 576px) {
      main {
        padding: 40px 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="" width="72" height="72" />
    <p class="eyebrow">Erro 404</p>
    <h1>Página não encontrada</h1>
    <p class="message">O endereço informado não existe ou não está mais disponível.</p>
    <a href="/">Voltar para o início</a>
  </main>
</body>
</html>
